name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datapulse
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: datapulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapulse -d datapulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://datapulse:datapulse@localhost:5432/datapulse
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Apply versioned schema from an empty database
        run: alembic upgrade head
      - name: Verify migration metadata matches ORM models
        run: alembic check
      - name: Verify production application imports without create_all
        run: python -c "from app.main import app; print(app.title)"
